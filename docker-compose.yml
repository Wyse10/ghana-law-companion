services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ghana_law}
      POSTGRES_USER: ${POSTGRES_USER:-ghana_law}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ghana-law-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ghana-law-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENVIRONMENT: production
      API_DOCS_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ghana_law}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-ghana_law}
      VECTOR_STORE_BACKEND: postgres
      DATABASE_POOL_MIN_SIZE: "1"
      DATABASE_POOL_MAX_SIZE: "10"
      SOURCE_SHA256: ${SOURCE_SHA256:?Set SOURCE_SHA256 to the indexed PDF SHA-256}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in the environment}
      API_KEY: ${API_KEY:?Set API_KEY for REST API authentication}
      API_KEYS: ${API_KEYS:-}
      REQUIRE_API_KEY: "true"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: "10"
      CORS_ORIGINS: ""
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 5

  nestjs:
    build:
      context: ./nestjs
      dockerfile: Dockerfile
    environment:
      FASTAPI_URL: http://api:8000
      API_KEY: ${API_KEY:?Set API_KEY for NestJS BFF}
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://127.0.0.1:3000/api/health/live",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  edge:
    image: caddy:2-alpine
    profiles: ["edge"]
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ghana-law-caddy-data:/data
      - ghana-law-caddy-config:/config
    depends_on:
      nestjs:
        condition: service_healthy

volumes:
  ghana-law-postgres:
  ghana-law-redis:
  ghana-law-caddy-data:
  ghana-law-caddy-config:
