[project]
name = "ghana-law-companion"
version = "0.1.0"
description = "RAG application for the Ghana Constitution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.8.1",
    "langchain-text-splitters",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pymupdf4llm",
    "pandas>=2.3.3",
    "gradio>=6.29.1",
    "litellm>=1.104.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
