[project]
name = "ghana-law-companion"
version = "0.1.0"
description = "RAG application for the Ghana Constitution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.8.1",
    "fastapi>=0.115.0",
    "langchain-text-splitters",
    "openai>=1.0.0",
    "pgvector>=0.3.0",
    "psycopg[binary,pool]>=3.2.0",
    "python-dotenv>=1.0.0",
    "pymupdf4llm",
    "pandas>=2.3.3",
    "gradio>=6.29.1",
    "sqlalchemy>=2.0.0",
    "streamlit>=1.65.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "prometheus-client>=0.20.0",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
