[project]
name = "ghana-law-companion"
version = "0.1.0"
description = "RAG application for the Ghana Constitution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-text-splitters",
    "pymupdf4llm",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]